name: Deploy Gramax Docs

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g gramax-cli

      - run: gramax-cli build --source ./docs --destination ./site

      - name: Copy custom CSS
        run: cp ./docs/assets/style.css ./site/style.css

      - name: Inject custom CSS
        run: |
          find ./site -name "*.html" -type f -exec sed -i 's|</head>|<link rel="stylesheet" href="/style.css"></head>|' {} +

      - run: cp ./docs/assets/favicon.ico ./site/favicon.ico

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4